<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>나트랑 여행 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E2A32;
    --bg-deep:#081C22;
    --surface:#153F49;
    --surface-2:#1B4C58;
    --line: rgba(245,241,230,0.12);
    --text:#F5F1E6;
    --muted:#9FC1C7;
    --muted-2:#6F949B;
    --coral:#FF7A56;
    --coral-dark:#C94B2C;
    --turquoise:#3CE0C4;
    --turquoise-dark:#0E7A67;
    --gold:#F2B84B;
    --gold-dark:#8A5E15;
    --indigo:#8B85D6;
    --indigo-dark:#4A4590;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height:100vh;
    padding-bottom: 60px;
  }
  .hero{
    position:relative;
    padding: 28px 20px 22px;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    overflow:hidden;
  }
  .hero svg{position:absolute; left:0; bottom:-2px; width:100%; height:46px; opacity:0.5;}
  .eyebrow{
    font-size:12px; letter-spacing:0.18em; color: var(--turquoise);
    margin:0 0 6px; font-weight:600; text-transform:uppercase;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:28px;
    margin:0 0 6px; letter-spacing:-0.01em;
  }
  .hero .dates{
    margin:0; font-size:13px; color: var(--muted);
  }
  .day-tabs{
    position: sticky; top:0; z-index:20;
    display:flex; gap:6px; padding:10px 14px;
    background: rgba(8,28,34,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    overflow-x:auto;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex: 0 0 auto;
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight:600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    white-space:nowrap;
  }
  .day-tab .d{display:block; font-size:10px; font-weight:500; opacity:0.75; margin-top:1px;}
  .day-tab.active{
    background: var(--coral);
    color: #4A1B0C;
    border-color: var(--coral);
  }
  .day-tab.today-marker::after{
    content:'· 오늘';
    color: var(--turquoise);
  }
  main{ padding: 18px 16px 12px; max-width: 560px; margin:0 auto; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .timeline{ position:relative; padding-left: 22px; }
  .timeline::before{
    content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px;
    background: var(--line);
  }
  .item{
    position:relative;
    margin-bottom: 16px;
  }
  .item .dot{
    position:absolute; left:-22px; top:5px;
    width:12px; height:12px; border-radius:50%;
    border: 2px solid var(--bg-deep);
  }
  .dot-morning{ background: var(--gold); }
  .dot-afternoon{ background: var(--turquoise); }
  .dot-evening{ background: var(--coral); }
  .dot-night{ background: var(--indigo); }

  .card{
    background: var(--surface);
    border-radius: 14px;
    padding: 13px 14px;
    border: 1px solid var(--line);
  }
  .card.flight{
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
    border-color: rgba(60,224,196,0.35);
  }
  .row-top{ display:flex; align-items:flex-start; gap:10px; }
  .time{
    font-family:'Fraunces', serif; font-weight:600; font-size:15px;
    color: var(--turquoise); min-width:48px; letter-spacing:-0.01em;
  }
  .titlewrap{ flex:1; min-width:0; }
  .title{ font-size:15.5px; font-weight:600; margin:0; line-height:1.35; }
  .tag{
    display:inline-block; font-size:10.5px; font-weight:600;
    padding: 2px 8px; border-radius:999px; margin-top:5px;
    letter-spacing:0.02em;
  }
  .tag-meal{ background: rgba(242,184,75,0.16); color: var(--gold); }
  .tag-spa{ background: rgba(60,224,196,0.16); color: var(--turquoise); }
  .tag-stay{ background: rgba(139,133,214,0.2); color: var(--indigo); }
  .tag-activity{ background: rgba(255,122,86,0.18); color: var(--coral); }
  .tag-move{ background: rgba(159,193,199,0.15); color: var(--muted); }
  .tag-night{ background: rgba(139,133,214,0.2); color: var(--indigo); }
  .tag-flight{ background: rgba(60,224,196,0.2); color: var(--turquoise); }

  .icon{
    flex:0 0 auto; width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    background: rgba(245,241,230,0.06);
  }
  .meta{ margin-top:8px; font-size:12.5px; color: var(--muted); line-height:1.5; }
  .meta .hours{ display:flex; align-items:center; gap:5px; }
  .note{
    margin-top:8px; font-size:12px; color: var(--gold);
    background: rgba(242,184,75,0.1); border-radius:8px; padding:6px 9px;
    line-height:1.5;
  }
  .actions{ display:flex; gap:8px; margin-top:10px; }
  .btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:12.5px; font-weight:600; padding:9px 10px; border-radius:9px;
    border:1px solid var(--line); background: rgba(245,241,230,0.04);
    color: var(--text); text-decoration:none; cursor:pointer;
  }
  .btn:active{ transform: scale(0.97); }
  .btn svg{ width:14px; height:14px; flex:0 0 auto; }
  .btn-map{ color:#DFF7F1; border-color: rgba(60,224,196,0.3); }
  .btn-copy{ color: var(--muted); }
  .btn-kakao{ color:#3A2E10; background: rgba(242,184,75,0.85); border-color: rgba(242,184,75,0.85); }

  .address{ font-size:12.5px; color: var(--muted); }

  .flight-route{
    display:flex; align-items:center; gap:8px; margin-top:6px;
    font-size:13px; color: var(--text); font-weight:600;
  }
  .flight-route .plane{ color: var(--turquoise); font-size:13px; }
  .flight-code{ font-size:11.5px; color: var(--muted); margin-top:4px; }

  .now-badge{
    display:inline-block; font-size:10px; font-weight:700; color:#4A1B0C;
    background: var(--coral); padding:2px 8px; border-radius:999px; margin-bottom:6px;
    letter-spacing:0.03em;
  }
  .item.current .card{ border-color: var(--coral); }

  .toast{
    position: fixed; left:50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg-deep); font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:999px; opacity:0; transition: all 0.25s ease;
    pointer-events:none; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>

function timeOfDay(t){
  const h = parseInt(t.split(':')[0],10);
  if(h>=6 && h<11) return 'morning';
  if(h>=11 && h<17) return 'afternoon';
  if(h>=17 && h<20) return 'evening';
  return 'night';
}
function tagClass(tag){
  return {meal:'tag-meal', spa:'tag-spa', stay:'tag-stay', activity:'tag-activity', move:'tag-move', night:'tag-night', flight:'tag-flight'}[tag] || 'tag-move';
}
function mapUrl(address){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
}
function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderItem(day, item, idx, isToday, nowMin){
  const dot = 'dot-' + timeOfDay(item.time);
  let currentClass = '';
  if(isToday){
    const [h,m] = item.time.split(':').map(Number);
    const itemMin = h*60+m;
    const next = day.items[idx+1];
    let nextMin = 24*60;
    if(next){ const [h2,m2]=next.time.split(':').map(Number); nextMin=h2*60+m2; if(nextMin<itemMin) nextMin=24*60; }
    if(nowMin>=itemMin && nowMin<nextMin) currentClass=' current';
  }
  let inner = '';
  if(item.flight){
    inner = `
      <div class="row-top">
        <div class="time">${item.time}</div>
        <div class="icon">${item.icon}</div>
        <div class="titlewrap">
          <p class="title">${escapeHtml(item.title)}</p>
          <span class="tag ${tagClass(item.tag)}">${escapeHtml(item.tagLabel)}</span>
        </div>
      </div>
      <div class="flight-route"><span class="plane">${escapeHtml(item.flightFrom)} → ${escapeHtml(item.flightTo)}</span></div>
      <div class="flight-code">${escapeHtml(item.flightSub)} · 전자항공권 A/S 확인</div>
    `;
  } else {
    const meta = item.hours ? `<div class="meta"><div class="hours">🕒 ${escapeHtml(item.hours)}</div></div>` : '';
    const addr = item.address ? `<div class="address" style="margin-top:6px;">📍 ${escapeHtml(item.address)}</div>` : '';
    const note = item.note ? `<div class="note">💡 ${escapeHtml(item.note)}</div>` : '';
    const kakaoBtn = item.kakao ? `
        <a class="btn btn-kakao" href="${item.kakao}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.48 3 2 6.58 2 11c0 2.8 1.83 5.26 4.6 6.68-.2.75-.73 2.7-.84 3.13-.13.53.2.53.42.38.17-.12 2.7-1.83 3.8-2.58.65.09 1.32.14 2.02.14 5.52 0 10-3.58 10-8s-4.48-8-10-8Z"/></svg>
          카카오 예약
        </a>` : '';
    const actions = (item.address || item.kakao) ? `
      <div class="actions">
        ${item.address ? `<a class="btn btn-map" href="${mapUrl(item.address)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.5 8-13a8 8 0 1 0-16 0c0 5.5 8 13 8 13Z"/><circle cx="12" cy="9" r="3"/></svg>
          지도 열기
        </a>` : ''}
        ${item.address ? `<button class="btn btn-copy" onclick="copyAddress(this, '${item.address.replace(/'/g,"\\'")}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          주소 복사
        </button>` : ''}
      </div>
      ${kakaoBtn ? `<div class="actions" style="margin-top:8px;">${kakaoBtn}</div>` : ''}` : '';
    const subtitle = item.subtitle ? `<div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${escapeHtml(item.subtitle)}</div>` : '';
    inner = `
      <div class="row-top">
        <div class="time">${item.time}</div>
        <div class="icon">${item.icon}</div>
        <div class="titlewrap">
          <p class="title">${escapeHtml(item.title)}</p>
          ${subtitle}
          <span class="tag ${tagClass(item.tag)}">${escapeHtml(item.tagLabel)}</span>
        </div>
      </div>
      ${addr}
      ${meta}
      ${note}
      ${actions}
    `;
  }
  const badge = currentClass ? `<span class="now-badge">지금</span><br/>` : '';
  return `<div class="item${currentClass}">
      <div class="dot ${dot}"></div>
      <div class="card${item.flight?' flight':''}">${badge}${inner}</div>
    </div>`;
}

function render(){
  const tabsEl = document.getElementById('dayTabs');
  const mainEl = document.getElementById('timeline');
  const today = new Date();
  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const nowMin = today.getHours()*60+today.getMinutes();
  let activeIdx = DATA.findIndex(d=>d.date===todayStr);
  if(activeIdx===-1) activeIdx = 0;

  tabsEl.innerHTML = DATA.map((d,i)=>`
    <button class="day-tab${i===activeIdx?' active':''}${d.date===todayStr?' today-marker':''}" data-idx="${i}">
      ${d.short}<span class="d">${d.label}</span>
    </button>`).join('');

  mainEl.innerHTML = DATA.map((d,i)=>`
    <div class="panel${i===activeIdx?' active':''}" id="panel-${i}">
      <div class="timeline">
        ${d.items.map((item,idx)=>renderItem(d,item,idx, d.date===todayStr, nowMin)).join('')}
      </div>
    </div>`).join('');

  tabsEl.querySelectorAll('.day-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = btn.dataset.idx;
      tabsEl.querySelectorAll('.day-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mainEl.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+idx).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function copyAddress(btn, address){
  const showToast = ()=>{
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(address).then(showToast).catch(()=>{ fallbackCopy(address); showToast(); });
  } else {
    fallbackCopy(address);
    showToast();
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

render();
</script>
